# Source: the-store/assistant/configmap.yaml
# Las claves (NVIDIA_API_KEY, GOOGLE_API_KEY) NO van acá: vienen del Secret
# assistant-api-keys, que crea local.sh y no se versiona.
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant
data:
  RETAIL_ASSISTANT_ENDPOINTS_CATALOG: http://catalog
  RETAIL_ASSISTANT_ENDPOINTS_CARTS: http://carts
  SPRING_AI_VECTORSTORE_QDRANT_HOST: qdrant
  SPRING_AI_VECTORSTORE_QDRANT_PORT: "6334"
  SPRING_AI_OPENAI_BASE_URL: https://integrate.api.nvidia.com
  SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: nvidia/nemotron-3-super-120b-a12b
  SPRING_AI_OPENAI_CHAT_OPTIONS_MAX_TOKENS: "1024"
  RETAIL_ASSISTANT_MODELS_REWRITE: nvidia/nemotron-3.5-lightning-30b-a3b
  SPRING_AI_GOOGLE_GENAI_EMBEDDING_TEXT_OPTIONS_MODEL: gemini-embedding-001
  SPRING_AI_GOOGLE_GENAI_EMBEDDING_TEXT_OPTIONS_DIMENSIONS: "768"
  # Chat (add-assistant-chat, D11). Los extra-body de razonamiento se cambian
  # con SPRING_APPLICATION_JSON (ver el README del assistant), por ejemplo:
  # SPRING_APPLICATION_JSON: '{"retail.assistant.chat.reasoning.on-extra-body":{"chat_template_kwargs":{"thinking":true}}}'
  RETAIL_ASSISTANT_REWRITE_TIMEOUT: 5s
  RETAIL_ASSISTANT_REWRITE_HISTORY_TURNS: "3"
  RETAIL_ASSISTANT_CHAT_RETRIEVAL_K: "5"
  RETAIL_ASSISTANT_CHAT_MIN_SCORE: "0"
  RETAIL_ASSISTANT_CHAT_MAX_TOKENS: "1024"
  RETAIL_ASSISTANT_CHAT_MAX_TOKENS_REASONING: "4096"
  RETAIL_ASSISTANT_CHAT_COMPARE_RAW_RETRIEVAL: "true"
  RETAIL_ASSISTANT_CHAT_REASONING_MODE: auto
  RETAIL_ASSISTANT_CHAT_REASONING_STRIP_THINK_TAGS: "false"
  RETAIL_ASSISTANT_CHAT_MEMORY_MAX_TURNS: "10"
  RETAIL_ASSISTANT_CHAT_MEMORY_IDLE_TTL: 30m
  RETAIL_ASSISTANT_CHAT_MEMORY_MAX_SESSIONS: "10000"
  RETAIL_ASSISTANT_CHAT_TIMEOUTS_FIRST_TOKEN: 20s
  RETAIL_ASSISTANT_CHAT_TIMEOUTS_FIRST_TOKEN_REASONING: 60s
  RETAIL_ASSISTANT_CHAT_TIMEOUTS_TURN: 120s
  RETAIL_ASSISTANT_CHAT_TIMEOUTS_KEEPALIVE: 10s
