  selector:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/owner: retail-store-sample
---
# Source: the-store/qdrant/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: qdrant
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/owner: retail-store-sample
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: qdrant
      app.kubernetes.io/component: vector-store
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: qdrant
        app.kubernetes.io/component: vector-store
        app.kubernetes.io/owner: retail-store-sample
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: qdrant
          env:
            # Sin telemetría: el único tráfico saliente del cluster es el del assistant.
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "qdrant/qdrant:v1.19.2-unprivileged"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 128m
              memory: 512Mi
          volumeMounts:
            - mountPath: /qdrant/storage
              name: qdrant-storage
            - mountPath: /qdrant/snapshots
              name: snapshots-volume
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: snapshots-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
        labels:
          app.kubernetes.io/name: qdrant
          app.kubernetes.io/instance: qdrant
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
