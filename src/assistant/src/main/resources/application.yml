server:
  port: ${port:8080}

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # La readiness depende solo del proceso: Qdrant y los proveedores quedan
      # fuera para que una caída no saque al assistant del Service (D4).
      group:
        readiness:
          include: readinessState

spring:
  application:
    name: assistant
  mvc:
    # Errores de la API en formato ProblemDetail (RFC 9457).
    problemdetails:
      enabled: true
    # Tope de una respuesta asíncrona (el SSE del chat): por encima del tiempo
    # límite de un turno (120 s) para que lo corte el turno y no Spring (D1).
    async:
      request-timeout: 150s
  http:
    client:
      # Timeouts de los RestClient (lectura del catálogo).
      connect-timeout: 2s
      read-timeout: 10s
  ai:
    # Sin reintentos automáticos de Spring AI: gastarían la cuota de 40 RPM de
    # NVIDIA y dejarían al usuario esperando sin aviso. Alcanza también al
    # EmbeddingModel, que igual no se usa para indexar ni buscar (D10).
    retry:
      max-attempts: 1
    # Chat: NVIDIA expone una API compatible con OpenAI. El cliente agrega
    # /v1/chat/completions a la base URL. NVIDIA exige max-tokens explícito.
    openai:
      base-url: https://integrate.api.nvidia.com
      api-key: ${NVIDIA_API_KEY:not-configured}
      chat:
        options:
          model: nvidia/nemotron-3-super-120b-a12b
          max-tokens: 1024
    # Embeddings: gemini-embedding-001 con 768 dimensiones. El task-type por
    # defecto es el de indexación; las consultas lo sobreescriben por llamada.
    google:
      genai:
        embedding:
          api-key: ${GOOGLE_API_KEY:not-configured}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
              task-type: RETRIEVAL_DOCUMENT
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        # La colección la crea y la sincroniza ProductIndexer, no el
        # QdrantVectorStore de Spring AI (que queda sin usar).
        initialize-schema: false
        collection-name: products

# Selección de modelos de Spring AI. Van como claves planas porque
# spring.ai.model.embedding y spring.ai.model.embedding.text no se pueden
# anidar en YAML. Se apagan las autoconfiguraciones de OpenAI que no se usan
# para que el único EmbeddingModel sea el de Google GenAI (D2).
spring.ai.model.embedding: none
spring.ai.model.embedding.text: google-genai
spring.ai.model.image: none
spring.ai.model.audio.speech: none
spring.ai.model.audio.transcription: none
spring.ai.model.moderation: none

retail:
  assistant:
    models:
      rewrite: nvidia/nemotron-3.5-lightning-30b-a3b
    endpoints:
      catalog: http://localhost:8081
      carts: http://localhost:8082
    # Sincronización del catálogo con Qdrant al arrancar (add-product-indexing).
    indexing:
      sync-on-startup: true
      page-size: 50
      # Máximo de textos por request a Gemini (batchEmbedContents acepta 100).
      batch-size: 100
      max-provider-retries: 5
    # Reescritura de consulta con el modelo compacto (add-assistant-chat, D4).
    # Los extra-body (campos extra del request a NVIDIA) tienen su default en
    # ChatProperties, porque Spring combina las claves de un mapa definido en
    # varias fuentes y un default acá no se podría reemplazar desde
    # SPRING_APPLICATION_JSON (plan B, ver el README). Defaults:
    #   rewrite.extra-body:              {"chat_template_kwargs": {"enable_thinking": false}}
    #   chat.reasoning.on-extra-body:    {"chat_template_kwargs": {"enable_thinking": true}}
    #   chat.reasoning.off-extra-body:   {"chat_template_kwargs": {"enable_thinking": false}}
    rewrite:
      timeout: 12s
      history-turns: 3
    # Turno de chat con el modelo principal (add-assistant-chat, D5-D11).
    chat:
      retrieval-k: 5
      min-score: 0
      max-tokens: 1024
      max-tokens-reasoning: 4096
      compare-raw-retrieval: true
      reasoning:
        mode: auto
        # Nemotron devuelve el razonamiento en reasoning_content, fuera del
        # texto (spike, D12): no hace falta filtrar <think>.
        strip-think-tags: false
      memory:
        max-turns: 10
        idle-ttl: 30m
        max-sessions: 10000
      timeouts:
        first-token-reasoning: 60s
        first-token: 20s
        turn: 120s
        keepalive: 10s
    # Tools del modelo principal (add-assistant-tools, D1-D5, D11).
    tools:
      max-model-calls: 4
      max-tool-calls: 6
      max-quantity: 10
      search-default-limit: 5
      search-max-limit: 10
      description-max-chars: 300
      http:
        connect-timeout: 2s
        read-timeout: 5s
    # Limitador hacia NVIDIA (40 RPM) y reintento ante 429 (add-assistant-tools, D8, D9).
    rate-limit:
      requests-per-minute: 36
      max-wait: 30s
      max-429-retries: 2
      default-retry-after: 5s
    search:
      default-k: 5
      max-k: 20
      similar-default-k: 4
      similar-max-k: 12
      query-cache-size: 256
