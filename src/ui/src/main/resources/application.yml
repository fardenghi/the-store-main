server:
  port: ${port:8080}
  forward-headers-strategy: NATIVE

spring:
  messages:
    basename: lang/messages
  codec:
    max-in-memory-size: 10MB

retail:
  ui:
    theme: default
    disable-demo-warnings: false
    product-images-path: # /mnt/products
    endpoints:
      catalog: # http://localhost:8081
      carts: # http://localhost:8082
      checkout: # http://localhost:8085
      orders: # http://localhost:8083
      assistant: # http://localhost:8086
    assistant:
      connect-timeout: 2s
      chat-timeout: 160s
      keepalive-interval: 10s
      similar-k: 4
      similar-timeout: 2s
    chat:
      enabled: false
      provider: # mock | openai | bedrock | assistant
      # model, temperature y max-tokens solo aplican a mock, openai y bedrock
      model:
      temperature: 0.6
      max-tokens: 300
      bedrock:
        region:
      openai:
        base-url: http://localhost:8000
        api-key:

management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus

otel.sdk.disabled: true
